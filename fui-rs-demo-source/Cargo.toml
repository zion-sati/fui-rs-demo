[workspace]
members = ["crates/ui", "crates/native", "crates/worker", "crates/shared", "crates/routes/*", "crates/web/*"]
resolver = "2"

[workspace.dependencies]
fui-rs = "=0.3.0"

[workspace.metadata.fui]
cargo-fui-version = "0.1.12"

[profile.dev]
debug = 0
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package]
name = "fui-rs-demo-ui"
version = "0.1.0"
edition = "2021"

[features]
default = []
native = [
  "fui/native-runtime",
  "dep:fui-rs-demo-worker",
  "fui-rs-demo-home/native-runtime",
  "fui-rs-demo-text-fonts/native-runtime",
  "fui-rs-demo-advanced/native-runtime",
  "fui-rs-demo-immediate-drawing/native-runtime",
  "fui-rs-demo-worker/native-runtime",
]

[dependencies]
fui = { package = "fui-rs", version = "=0.4.1" }
fui-rs-demo-home = { path = "../routes/home" }
fui-rs-demo-text-fonts = { path = "../routes/text-fonts" }
fui-rs-demo-advanced = { path = "../routes/advanced" }
fui-rs-demo-immediate-drawing = { path = "../routes/immediate-drawing" }
fui-rs-demo-shared = { path = "../shared" }
fui-rs-demo-worker = { path = "../worker", optional = true }

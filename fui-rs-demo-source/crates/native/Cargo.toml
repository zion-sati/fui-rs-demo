[package]
name = "fui-rs-demo"
version = "0.1.0"
edition = "2021"

[lib]
name = "fui_rs_demo"
crate-type = ["staticlib"]

[dependencies]
fui = { package = "fui-rs", version = "=0.2.16" }
fui_rs_demo_ui = { package = "fui-rs-demo-ui", path = "../ui", features = ["native"] }
fui_rs_demo_worker = { package = "fui-rs-demo-worker", path = "../worker" }
